// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        // Adding the maven url for Assets plugin
        // block:start:assets-plugin-maven-url
        maven { url "https://payments.bharatpex.com/payments-sdk/" }
        // block:end:assets-plugin-maven-url
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.0.0"
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.30'

        // Adding the class path for Assets plugin
        // block:start:assets-class-path
        classpath 'com.bharatpex:bharatpexpaymentsdk.plugin:2.2.13'
        // block:end:assets-class-path

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // Adding the build package
        //block:start:bharatpexpayments-sdk-maven-url
        maven {
            url "https://payments.bharatpex.com/payments-sdk/"
        }
        //block:end:bharatpexpayments-sdk-maven-url
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}
