plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    
    // Applying HyperAssets plugin
    // block:start:apply-plugin
    id 'hypersdk.plugin'
    // block:end:apply-plugin
}

android {
    namespace "in.juspay.devtools"
    compileSdk 34

    defaultConfig {
        applicationId "in.juspay.devtools"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Align kotlin-stdlib / -jdk7 / -jdk8 to one version. Kotlin 1.8 merged the
    // jdk7/jdk8 artifacts into kotlin-stdlib; the BOM resolves the old jdk7/jdk8
    // coords (pulled transitively) to empty stubs, avoiding duplicate-class errors.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.google.android.material:material:1.1.0'
    implementation("com.squareup.okhttp3:okhttp:4.9.3")
    implementation 'androidx.constraintlayout:constraintlayout-core:1.0.4'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

}

// Adding HyperSDK implementation
//block:start:add-sdk-implementation
hyperSdkPlugin {
    clientId = "hdfcmaster"
    sdkVersion = "2.2.8-rc.04"
}
//block:end:add-sdk-implementation
